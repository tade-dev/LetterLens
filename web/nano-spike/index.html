<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LetterLens Nano spike</title>
<style>body{font:15px/1.5 -apple-system,system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px}
pre{background:#f4f4f4;padding:12px;white-space:pre-wrap;border-radius:8px}button{font-size:16px;padding:10px 18px;margin:0 8px 8px 0}</style>
<script src="./config.local.js"></script></head><body>
<h1>LetterLens: Gemini Nano spike</h1>
<p>On-device only (<code>ONLY_ON_DEVICE</code>). Nothing is sent to the cloud. Run spike checks the model. Run card test sends test letter 01 with the v1 card prompt and asks for JSON. Copy the report below into the room.</p>
<button id="run">Run spike</button>
<button id="card">Run card test</button>
<pre id="out">Not run yet.</pre>
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider, getToken } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app-check.js";
import { getAI, getGenerativeModel, GoogleAIBackend, InferenceMode } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-ai.js";

const LETTER = "NORTHBRIDGE CITY COUNCIL\nCouncil Tax Office\nCivic Centre\n[COUNCIL ADDRESS]\n[COUNCIL POSTCODE]\n\nwww.northbridge.example                 Telephone: [PHONE]\n\n\nDate: 3 November 2026\n\nOur reference: [ACCOUNT REF]\nProperty: [ADDRESS LINE 1], [POSTCODE]\n\n[NAME]\n[ADDRESS LINE 1]\n[ADDRESS LINE 2]\n[POSTCODE]\n\n\nCouncil Tax - Reminder\n\n\nDear [NAME],\n\nI am writing because we have not received the Council Tax payment of\n\u00a3[AMOUNT] due on your account [ACCOUNT REF] for the property at\n[ADDRESS LINE 1], [POSTCODE].\n\nYour last payment was received on 15 October 2026. The outstanding\nbalance on the account is \u00a3[AMOUNT].\n\nYou must pay the outstanding balance of \u00a3[AMOUNT] by 1 December 2026.\n\nIf you have already paid, please ignore this reminder and accept our\nthanks. If you cannot pay in full, contact us before that date so we\ncan talk about a payment arrangement.\n\nIf you do not pay or get in touch, we may send you a final notice.\nAfter a final notice we may apply to the Magistrates' Court for a\nliability order. That can add costs to the amount you owe.\n\nHow to pay\n- Online at www.northbridge.example/counciltax, using reference [ACCOUNT REF]\n- By Direct Debit - call [PHONE] to set this up\n- At a PayPoint outlet, using reference [ACCOUNT REF]\n\nYours sincerely,\n\n[OFFICER NAME]\nCouncil Tax Manager\nNorthbridge City Council\n\n\nThis notice is a reminder issued under the Council Tax (Administration and\nEnforcement) Regulations 1992. If you have a query about your bill, Council\nTax Support or a discount, contact us on [PHONE] or write to the address at\nthe top of this letter.\n";

// v1 card prompt, copied from firebase/remoteconfig.template.json (card_schema_version 1).
// firebase-ai.js 13.3.0 does not send responseMimeType or responseSchema to the on-device
// model when mode is set, so ONLY_ON_DEVICE uses this prompt alone.
const CARD_PROMPT = `You read UK official letters and explain them in plain English.
Use ONLY the letter text below. If something is not written in the letter, leave it null.

Reply with JSON only, matching exactly:
{
  "type": "short label, e.g. council tax reminder",
  "sender_kind": "council | hmrc | bank | benefits | school | utility | landlord | nhs | other",
  "action": "what they want the reader to do, 1-2 short sentences, second person",
  "deadline": "YYYY-MM-DD or null",
  "deadline_quote": "the exact words from the letter that state the deadline, or null",
  "amount_quote": "exact words stating an amount owed or due, or null",
  "watch_outs": ["consequence or important condition, short sentence", "..."],
  "scam_signs": [{"sign": "short description", "quote": "exact words or null"}],
  "no_action_needed": true or false
}

Rules:
- If no deadline is written in the letter, deadline and deadline_quote must be null. Do not guess.
- Quotes must be copied word for word from the letter.
- Never say a letter is safe or genuine.
- Scam signs include: asking for a fee to release money, payment links not on the official domain, extreme urgency, requests for passwords or card details, mismatched sender details.

LETTER:
<<<
{ocr_text}
>>>`;

const REQUIRED_FIELDS = ["type", "sender_kind", "action", "deadline", "deadline_quote", "amount_quote", "watch_outs", "scam_signs", "no_action_needed"];

const out = document.getElementById("out");
const log = (k, v) => { out.textContent += `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}\n`; };
const runButton = document.getElementById("run");
const cardButton = document.getElementById("card");
let firebaseApp = null;
let appCheckStarted = false;

function formatProgress(loaded) {
  if (typeof loaded !== "number" || Number.isNaN(loaded)) return String(loaded);
  const pct = loaded <= 1 ? loaded * 100 : loaded;
  return `${Math.round(pct * 100) / 100}%`;
}

function quoteVerbatim(value) {
  if (value == null) return "null";
  if (typeof value !== "string" || value.length === 0) return "not a quote";
  return LETTER.includes(value) ? "yes" : "no";
}

function logQuoteFields(value, path) {
  if (value == null || typeof value !== "object") return;
  if (Array.isArray(value)) {
    value.forEach((item, i) => logQuoteFields(item, `${path}[${i}]`));
    return;
  }
  for (const [key, child] of Object.entries(value)) {
    const childPath = path ? `${path}.${key}` : key;
    if (key === "quote" || key.endsWith("_quote")) log(`${childPath} verbatim`, quoteVerbatim(child));
    else if (child && typeof child === "object") logQuoteFields(child, childPath);
  }
}

function logCard(raw) {
  log("Raw JSON", raw);
  let parsed;
  try {
    parsed = JSON.parse(raw);
    log("Parses", "yes");
  } catch (e) {
    log("Parses", "no");
    log("Parse error", String(e));
    return;
  }
  if (parsed === null || typeof parsed !== "object" || Array.isArray(parsed)) {
    log("Field checks", "response is not a JSON object");
    return;
  }
  for (const field of REQUIRED_FIELDS) {
    log(`field ${field}`, Object.hasOwn(parsed, field) ? "present" : "missing");
  }
  logQuoteFields(parsed, "");
}

async function readEnvironment() {
  const ua = navigator.userAgentData ? (await navigator.userAgentData.getHighEntropyValues(["fullVersionList", "platform"])) : null;
  log("Chrome", ua ? ua.fullVersionList.map(b => `${b.brand} ${b.version}`).join(", ") : navigator.userAgent);
  log("Platform", ua ? ua.platform : navigator.platform);
  const present = typeof self.LanguageModel !== "undefined";
  log("Prompt API present", present);
  if (!present) return { present, availability: null };
  try {
    const availability = await LanguageModel.availability();
    log("LanguageModel.availability()", availability);
    return { present, availability };
  } catch (e) {
    log("availability error", String(e));
    return { present, availability: null };
  }
}

function readyForOnDevice(present, availability) {
  if (!present) {
    log("Message", "Use Google Chrome.");
    return false;
  }
  if (availability === "unavailable") {
    log("State", "unavailable");
    log("Message", "The Prompt API is present but the on-device model is unavailable. Use Google Chrome.");
    return false;
  }
  if (availability === "downloadable" || availability === "downloading" || availability === "available") {
    log("State", availability);
  }
  return true;
}

async function ensureFirebase() {
  if (!self.LL_CONFIG) {
    log("Config", "missing config.local.js, stopping");
    return null;
  }
  if (!firebaseApp) firebaseApp = getApps().length ? getApps()[0] : initializeApp(self.LL_CONFIG);
  if (!appCheckStarted) {
    const appCheck = initializeAppCheck(firebaseApp, { provider: new ReCaptchaEnterpriseProvider("debug-only-placeholder"), isTokenAutoRefreshEnabled: false });
    try { await getToken(appCheck); log("App Check", "debug token accepted"); } catch (e) { log("App Check error", String(e)); }
    appCheckStarted = true;
  }
  return getAI(firebaseApp, { backend: new GoogleAIBackend() });
}

function onDeviceModel(ai) {
  return getGenerativeModel(ai, { mode: InferenceMode.ONLY_ON_DEVICE });
}

async function initDevice(model) {
  log("initializeDeviceModel", "starting (may download the model, can take minutes)");
  if (typeof model.initializeDeviceModel === "function") {
    await model.initializeDeviceModel((loaded) => log("Download progress", formatProgress(loaded)));
  }
  if (typeof self.LanguageModel !== "undefined") log("availability after init", await LanguageModel.availability());
}

function overLimit(text, label) {
  const estTokens = Math.ceil(text.length / 4);
  log(label, `${estTokens} of 9216`);
  if (estTokens > 9216) {
    log("Stop", "over the on-device limit");
    return true;
  }
  return false;
}

async function prepare() {
  const { present, availability } = await readEnvironment();
  if (!readyForOnDevice(present, availability)) return null;
  const ai = await ensureFirebase();
  if (!ai) return null;
  return onDeviceModel(ai);
}

async function withBusy(work) {
  runButton.disabled = true;
  cardButton.disabled = true;
  try { await work(); } finally {
    runButton.disabled = false;
    cardButton.disabled = false;
  }
}

runButton.onclick = () => withBusy(async () => {
  out.textContent = "";
  try {
    const model = await prepare();
    if (!model) return;
    if (overLimit(LETTER, "Letter tokens (rough estimate, chars/4)")) return;
    await initDevice(model);
    const t0 = performance.now();
    const res = await model.generateContent("Summarise this letter in two sentences, then state who sent it and any date or amount it mentions. Do not invent anything.\n\n" + LETTER);
    log("Time to answer (ms)", Math.round(performance.now() - t0));
    log("Inference source", res.response.inferenceSource ?? "not reported by SDK");
    log("Answer", res.response.text());
  } catch (e) { log("Error", `${e.code ?? ""} ${e.message ?? e}`); }
});

cardButton.onclick = () => withBusy(async () => {
  out.textContent = "";
  try {
    const model = await prepare();
    if (!model) return;
    const prompt = CARD_PROMPT.replace("{ocr_text}", LETTER);
    if (overLimit(prompt, "Prompt tokens (rough estimate, chars/4)")) return;
    log("Schema", "v1 from firebase/remoteconfig.template.json card_prompt");
    log("Output mode", "prompt only");
    await initDevice(model);
    const t0 = performance.now();
    const res = await model.generateContent(prompt);
    log("Time to answer (ms)", Math.round(performance.now() - t0));
    log("Inference source", res.response.inferenceSource ?? "not reported by SDK");
    logCard(res.response.text());
  } catch (e) { log("Error", `${e.code ?? ""} ${e.message ?? e}`); }
});
</script></body></html>
